<mat-grid-list cols="3" rowHeight="3:1">
    <mat-grid-tile 
        [colspan]="3"
        [rowspan]="2"
    >
            Bean Title

    </mat-grid-tile>
    <mat-grid-tile
        [colspan]="2"
        [rowspan]="2"
    >
        <mat-tab-group>
            <mat-tab label="First"> Content 1 </mat-tab>
            <mat-tab label="Second"> Content 2 </mat-tab>
            <mat-tab label="Third"> Content 3 </mat-tab>
        </mat-tab-group>

    </mat-grid-tile>

    <mat-grid-tile
        [colspan]="1"
        [rowspan]="3"
    >
        Reviews
    </mat-grid-tile>
</mat-grid-list>
